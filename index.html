<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enas Karaem</title>
    <meta
      name="description"
      content="Software engineer based in Genova — profiles, work, and education."
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="site-header">
      <nav class="nav" aria-label="Primary">
        <a class="nav-brand" href="#top">EK</a>

        <div class="nav-links" id="nav-links">
          <a href="#about" data-nav-section="about">About</a>
          <a href="#work" data-nav-section="work">Work</a>
          <a href="#education" data-nav-section="education">Education</a>
          <a href="#projects" data-nav-section="projects" hidden>Projects</a>
          <a class="nav-cv" href="assets/RF-EnasKaraem-CV.pdf" download>CV</a>
        </div>

        <div class="nav-controls">
          <div class="icon-group" role="group" aria-label="Theme">
            <button
              type="button"
              class="icon-btn"
              data-theme-set="light"
              aria-label="Light mood"
              title="Light mood"
            >
              <img src="assets/images/light-mood.ico" alt="" width="22" height="22" />
            </button>
            <button
              type="button"
              class="icon-btn"
              data-theme-set="dark"
              aria-label="Dark mood"
              title="Dark mood"
            >
              <img src="assets/images/dark-mood.ico" alt="" width="22" height="22" />
            </button>
          </div>
        </div>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-name">
        <p class="hero-kicker" id="hero-title">Software Engineer</p>
        <h1 id="hero-name">Enas Karaem</h1>
        <p class="hero-about" id="hero-about"></p>
        <div class="hero-meta" id="hero-meta"></div>
        <div class="hero-actions" id="hero-actions"></div>
      </section>

      <section id="about" class="section is-empty">
        <h2>About</h2>
        <p id="about-text"></p>
        <div id="skills" class="skills"></div>
      </section>

      <section id="work" class="section is-empty">
        <h2>Work</h2>
        <div id="work-list" class="timeline"></div>
      </section>

      <section id="education" class="section is-empty">
        <h2>Education</h2>
        <div id="education-list" class="timeline"></div>
      </section>

      <section id="projects" class="section is-empty">
        <h2>Projects</h2>
        <div id="projects-list" class="projects"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-languages" aria-label="Languages spoken" title="Language selection coming later">
        <span class="lang-icon is-disabled" aria-disabled="true">
          <img src="assets/images/english.ico" alt="English" width="24" height="24" />
        </span>
        <span class="lang-icon is-disabled" aria-disabled="true">
          <img src="assets/images/arabic.ico" alt="Arabic" width="24" height="24" />
        </span>
        <span class="lang-icon is-disabled" aria-disabled="true">
          <img src="assets/images/italian.ico" alt="Italian" width="24" height="24" />
        </span>
      </div>
      <p id="footer-copy"></p>
    </footer>

    <script src="data/cv.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
